name: CI Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes do backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: c216_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c216_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c216_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar Poetry
        run: python -m pip install poetry==2.4.2

      - name: Instalar dependências
        run: poetry install --with dev --no-interaction

      - name: Validar lint
        run: poetry run ruff check .

      - name: Aplicar migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c216_test
        run: poetry run alembic upgrade head

      - name: Conferir migrations e modelos
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c216_test
        run: poetry run alembic check

      - name: Executar todos os testes
        run: poetry run pytest -v
