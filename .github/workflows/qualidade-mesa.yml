name: Qualidade do Mesa da Rodada

on:
  push:
    branches: [projeto-final]

permissions:
  contents: read

jobs:
  verificar-backend:
    name: Backend - lint, formato e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter o projeto
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Python compativel com a API
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Disponibilizar o Poetry
        run: python -m pip install "poetry==2.4.2"

      - name: Instalar o ambiente do projeto
        run: make preparar

      - name: Conferir a qualidade e executar os testes
        run: make verificar
