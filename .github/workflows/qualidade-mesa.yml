name: Qualidade do Mesa da Rodada

on:
  push:
    branches: [projeto-final]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar-backend:
    name: Backend - lint, formato e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MESA_TESTE_POSTGRES: "1"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: mesa_teste
      DB_USER: mesa_ci
      DB_PASSWORD: mesa_ci
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: mesa_teste
          POSTGRES_USER: mesa_ci
          POSTGRES_PASSWORD: mesa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mesa_ci -d mesa_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter o projeto
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Python compativel com a API
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Disponibilizar o Poetry
        run: python -m pip install "poetry==2.4.2"

      - name: Instalar o ambiente do projeto
        run: make preparar

      - name: Conferir a qualidade e executar os testes
        run: make verificar

  verificar-frontend:
    name: Frontend - qualidade, build e navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar e verificar a interface
        run: |
          make frontend-preparar
          make frontend-verificar

      - name: Testar React, API e PostgreSQL no Chromium
        run: |
          make frontend-instalar-navegador-ci
          make frontend-e2e
