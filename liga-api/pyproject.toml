[project]
name = "liga-api"
version = "0.1.0"
description = "API do Mesa da Rodada para simular partidas e calcular classificacoes"
authors = [
    {name = "Antônio César Faria de Neto",email = "antonio.faria.cn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]

[tool.poetry]
packages = [{include = "liga_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
